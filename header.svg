<svg fill="none" viewBox="0 0 800 600" width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glitch-filter">
      <feColorMatrix type="saturate" values="3"/>
      <feGaussianBlur stdDeviation="5"/>
      <feComponentTransfer>
        <feFuncR type="discrete" tableValues="0 0.5 1"/>
        <feFuncG type="discrete" tableValues="0 0.2 0.8"/>
        <feFuncB type="discrete" tableValues="0 0.1 0.9"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');

        @keyframes glitch-anim {
          0% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%); }
          5% { clip-path: polygon(0 10%, 100% 0, 100% 100%, 0 90%); }
          10% { clip-path: polygon(0 0, 100% 0, 90% 100%, 0 100%); }
          15% { clip-path: polygon(0 0, 100% 10%, 100% 100%, 0 90%); }
          20% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%); }
        }

        @keyframes blood-drip {
          0% { transform: translateY(0) scaleY(1); }
          50% { transform: translateY(20px) scaleY(1.2); }
          100% { transform: translateY(50px) scaleY(0.8); }
        }

        body {
          margin: 0;
          background: linear-gradient(45deg, #000000, #1a1a1a, #330000);
          font-family: 'Orbitron', sans-serif;
          overflow: hidden;
        }

        .sinister-container {
          position: relative;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 600px;
          color: #ff0000;
          text-transform: uppercase;
          perspective: 1000px;
        }

        .glitch-text {
          font-size: 4rem;
          font-weight: 900;
          text-shadow: 
            -2px -2px 0 #00ff00, 
            2px 2px 0 #0000ff;
          animation: 
            glitch-anim 2s infinite linear alternate-reverse;
          filter: url(#glitch-filter);
        }

        .blood-drip {
          position: absolute;
          width: 5px;
          height: 50px;
          background: linear-gradient(to bottom, #ff0000, #800000);
          animation: blood-drip 3s infinite alternate;
          opacity: 0.7;
        }

        .skills {
          display: flex;
          gap: 15px;
          margin-top: 20px;
          perspective: 1000px;
        }

        .skill {
          background: rgba(255, 0, 0, 0.2);
          border: 2px solid #ff0000;
          color: #ff0000;
          padding: 10px 20px;
          text-transform: uppercase;
          letter-spacing: 2px;
          transition: all 0.3s;
          transform-style: preserve-3d;
          transform: rotateX(15deg);
        }

        .skill:hover {
          transform: scale(1.1) rotateX(0);
          background: rgba(255, 0, 0, 0.5);
        }
      </style>
      <div class="sinister-container">
        <div class="blood-drip" style="left: 20%;"></div>
        <div class="blood-drip" style="right: 20%;"></div>
        <h1 class="glitch-text">Jeriah Oliverasfair</h1>
        <p style="color: #00ff00; font-size: 1.5rem;">Hacking the Future | Coding the Darkness</p>
        <div class="skills">
          <div class="skill">HTML</div>
          <div class="skill">CSS</div>
          <div class="skill">Python</div>
          <div class="skill">JavaScript</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>

